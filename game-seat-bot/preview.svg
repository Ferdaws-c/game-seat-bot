    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06152b" flood-opacity=".28"/></filter>
  </defs>
  <rect width="960" height="580" rx="28" fill="url(#bg)"/>
  <circle cx="840" cy="75" r="160" fill="#2a5793" opacity=".25"/>
